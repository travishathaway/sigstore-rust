name: Build Python Wheels

on:
  push:
    tags:
      - "py-v*"
  pull_request:
    paths:
      - "crates/sigstore-python/**"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Linux — manylinux_2_28, x86_64 and aarch64
  # The maturin container already includes gcc; aws-lc-rs (non-FIPS) only
  # needs a C compiler, no cmake required.
  # ──────────────────────────────────────────────────────────────────────────
  linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/sigstore-python
          target: ${{ matrix.target }}
          manylinux: 2_28
          args: --release --locked --out dist
          # abi3-py310 wheel works on Python 3.10, 3.11, 3.12, 3.13+
          # No extra before-script needed; gcc is pre-installed in the container.

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: crates/sigstore-python/dist

  # ──────────────────────────────────────────────────────────────────────────
  # macOS — x86_64 and arm64 (Apple Silicon)
  # ──────────────────────────────────────────────────────────────────────────
  macos:
    name: macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13        # last x86_64 GitHub-hosted macOS runner
          - target: aarch64-apple-darwin
            runner: macos-latest    # ARM64 (M-series)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/sigstore-python
          target: ${{ matrix.target }}
          args: --release --locked --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: crates/sigstore-python/dist

  # ──────────────────────────────────────────────────────────────────────────
  # Windows x86_64
  # aws-lc-rs non-FIPS uses the `prebuilt-nasm` feature to avoid requiring
  # NASM to be installed separately in CI.
  # ──────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/sigstore-python
          target: x86_64
          args: >-
            --release --locked --out dist
            --features aws-lc-rs/prebuilt-nasm

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: crates/sigstore-python/dist

  # ──────────────────────────────────────────────────────────────────────────
  # Source distribution (sdist) — required for PyPI completeness
  # ──────────────────────────────────────────────────────────────────────────
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/sigstore-python
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/sigstore-python/dist

  # ──────────────────────────────────────────────────────────────────────────
  # Stub check — regenerate .pyi and fail if it differs from committed copy
  # ──────────────────────────────────────────────────────────────────────────
  stub-check:
    name: Stub file up-to-date check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate stubs
        working-directory: crates/sigstore-python
        run: cargo run --bin stub_gen

      - name: Check for drift
        run: |
          git diff --exit-code crates/sigstore-python/python/py_sigstore_rust/_internal.pyi \
            || (echo "ERROR: _internal.pyi is out of date. Run 'cargo run --bin stub_gen' and commit the result." && exit 1)

  # ──────────────────────────────────────────────────────────────────────────
  # Publish to PyPI — only on `py-v*` tags, after all wheels succeed
  # ──────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [linux, macos, windows, sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/py-sigstore-rust
    permissions:
      id-token: write  # Required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
